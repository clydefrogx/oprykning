name: Update dashboard

on:
  push:
    branches: [main]             # deploy as soon as changes are pushed
  schedule:
    # Once a day at 02:43 UTC (04:43 Danish summer time, 03:43 in winter): a quiet
    # time on GitHub, away from the busy top of the hour. It may still start late.
    - cron: "43 2 * * *"
  workflow_dispatch:             # lets you start it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false      # never cancel a deploy that is already running

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
