name: Update dashboard

on:
  push:
    branches: [main]             # deploy as soon as changes are pushed
  schedule:
    # Once a day at 03:00 Danish time. GitHub only understands UTC, and Danish
    # 03:00 is 01:00 UTC in summer but 02:00 UTC in winter, so the job is
    # started at both times and the "gate" step below lets only the right one run.
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:             # lets you start it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false      # never cancel a deploy that is already running

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Gate (scheduled runs only continue at 03:00 Danish time)
        id: gate
        run: |
          hour=$(TZ=Europe/Copenhagen date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "03" ]; then
            echo "Danish hour is $hour, not 03: skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.go == 'true'
        run: pip install requests beautifulsoup4
      # history.json remembers the previous ranking (for the arrows); a fresh
      # key each run makes the cache save the updated file every time
      - if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: history.json
          key: history-${{ github.run_id }}
          restore-keys: history-
      - if: steps.gate.outputs.go == 'true'
        run: python build.py
      - if: steps.gate.outputs.go == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.gate.outputs.go == 'true'
        uses: actions/deploy-pages@v4
