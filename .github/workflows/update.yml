name: Update dashboard

on:
  push:
    branches: [main]             # deploy as soon as changes are pushed
  schedule:
    # Once a day at 21:43 UTC (23:43 Danish summer time, 22:43 in winter). GitHub has
    # been starting scheduled runs about 6 hours late, so this usually runs early morning.
    - cron: "43 21 * * *"
  workflow_dispatch:             # lets you start it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false      # never cancel a deploy that is already running

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
