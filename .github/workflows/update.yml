# Save as .github/workflows/update.yml in your repository
name: Update dashboard

on:
  push:
    branches: [main]             # deploy as soon as changes are merged
  schedule:
    - cron: "0 6,12,18 * * *"   # three times a day (UTC)
  workflow_dispatch:             # lets you start it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false      # never cancel a deploy that is already running

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      # history.json remembers the previous ranking (for the arrows); a fresh
      # key each run makes the cache save the updated file every time
      - uses: actions/cache@v4
        with:
          path: history.json
          key: history-${{ github.run_id }}
          restore-keys: history-
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
